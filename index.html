<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Phiếu Lương Nhân Viên</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- View Đăng Nhập -->
    <div id="loginCard" class="card">
      <h2>ĐĂNG NHẬP TRA CỨU LƯƠNG</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Số Căn Cước (CCCD)</label>
          <input type="text" id="citizenId" placeholder="Nhập số CCCD" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Mật Khẩu</label>
          <input type="password" id="password" placeholder="Mật khẩu lần đầu là Mã NV" required autocomplete="current-password">
        </div>
        <button type="submit" id="btnLogin">Đăng Nhập</button>
      </form>
      <p id="loginMsg" class="msg-error"></p>
    </div>

    <!-- View Đổi Mật Khẩu Bắt Buộc -->
    <div id="changePwdCard" class="card hidden">
      <h2>ĐỔI MẬT KHẨU LẦN ĐẦU</h2>
      <p class="sub-text">Để đảm bảo an toàn thông tin, vui lòng đổi mật khẩu trước khi xem phiếu lương.</p>
      <form id="changePwdForm">
        <div class="form-group">
          <label>Mật Khẩu Mới</label>
          <input type="password" id="newPassword" placeholder="Nhập mật khẩu mới" required>
        </div>
        <div class="form-group">
          <label>Xác Nhận Mật Khẩu Mới</label>
          <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu mới" required>
        </div>
        <button type="submit">Xác Nhận Đổi Mật Khẩu</button>
      </form>
      <p id="pwdMsg" class="msg-error"></p>
    </div>

    <!-- View Bảng Lương -->
    <div id="dashboardCard" class="card hidden wide">
      <div class="header-bar">
        <div>
          <h2 id="userInfo">Phiếu Lương Nhân Viên</h2>
          <span id="userSubInfo" class="badge"></span>
        </div>
        <div>
          <button id="btnAdmin" class="btn-admin hidden">Reset Mật Khẩu (Admin)</button>
          <button id="btnLogout" class="btn-logout">Đăng Xuất</button>
        </div>
      </div>

      <div class="filter-bar">
        <label>Chọn Kỳ Lương: </label>
        <select id="selectPayMonth"></select>
      </div>

      <div id="payrollDetail" class="payroll-detail"></div>
    </div>

    <!-- Modal Admin Reset -->
    <div id="adminModal" class="modal hidden">
      <div class="modal-content">
        <h3>Admin: Reset Mật Khẩu Nhân Viên</h3>
        <div class="form-group">
          <label>Số CCCD Nhân Viên Cần Reset:</label>
          <input type="text" id="targetCitizenId" placeholder="Nhập CCCD nhân viên">
        </div>
        <div class="modal-actions">
          <button id="btnConfirmReset">Reset Về Mã NV</button>
          <button id="btnCloseAdmin" class="btn-secondary">Đóng</button>
        </div>
        <p id="adminMsg" class="msg-error"></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
